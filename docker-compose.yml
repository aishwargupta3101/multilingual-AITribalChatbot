services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: tribal-chatbot-api

    # Request access to all NVIDIA GPUs for the API container.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      PYTHONPATH: "/app"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./vector_db:/app/vector_db
      - huggingface_cache:/root/.cache/huggingface

    restart: unless-stopped

    # Required because the frontend waits for the API to become healthy.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: tribal-chatbot-frontend

    ports:
      - "8501:10000"

    env_file:
      - .env

    environment:
      BACKEND_URL: "http://api:8000"
      TRIBAL_API_BASE_URL: "http://api:8000"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  huggingface_cache:
